apis:
- name: Calviri Site MCP
  description: >-
    An anonymous Model Context Protocol endpoint served from Calviri's own host
    at https://www.calviri.com/_api/mcp. It is the standard Wix "Site Visitor
    Assistant" server that the Wix platform provisions for every site — not an
    API Calviri built — but it is live and callable without credentials, and
    `initialize` plus `tools/list` both returned 200 on 2026-08-09 exposing nine
    tools (GetBusinessDetails, SearchInSite, SearchSiteApiDocs,
    GenerateVisitorToken, CallWixSiteAPI, ExecuteWixAPI, BrowseWixRESTDocsMenu,
    ReadFullDocsArticle, ReadFullDocsMethodSchema). It reads only information
    that is already public on the website.
  humanURL: https://www.calviri.com/
  baseURL: https://www.calviri.com/_api/mcp
