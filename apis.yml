aid: calviri
name: Calviri
description: >-
  Calviri is a Phoenix, Arizona biotechnology company, founded in 2017, that
  develops multi-cancer diagnostic tests and therapeutic and preventative cancer
  vaccines for dogs and people. Its science rests on RNA-Error Derived
  Neoantigens (REDNs) — abnormal proteins thrown off by the error-prone RNA
  processing of tumor cells — which Calviri builds as peptides on semiconductor
  chips and then queries against an individual's blood for antibody responses,
  using those antibodies as sensitive biomarkers of cancer. Its lead product,
  StageOne Plus, is a canine multi-cancer blood test designed to detect stage 1
  disease before signs appear, alongside a pipeline of canine and human
  therapeutic and preventative vaccines and a preventative-vaccine trial (VACCS)
  that enrolled 800+ dogs. Calviri is a life-sciences company with no developer
  program, no product API and no developer portal; the only machine-readable
  surface on calviri.com is the Wix-platform-generated llms.txt and the
  anonymous site MCP endpoint it advertises.
