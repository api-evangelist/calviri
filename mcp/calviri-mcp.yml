description: 'Calviri serves a live, anonymous Model Context Protocol endpoint from its own host at https://www.calviri.com/_api/mcp.
  The endpoint is PLATFORM-PROVIDED by Wix (calviri.com is a Wix site) rather than built by Calviri engineering
  — it is the standard Wix "Site Visitor Assistant" MCP server, advertised in the Wix-generated /llms.txt.
  It is nonetheless a real machine-readable surface on the company''s own domain: an anonymous `initialize`
  and `tools/list` both returned 200 on 2026-08-09 and the nine tools below were captured verbatim (see
  calviri-mcp-tools-list.json). Calviri publishes no product API of its own — no OpenAPI, no GraphQL,
  no developer portal (see x-coverage in apis.yml).'
